<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator Formulary — 981 techniques of influence across 192 families</title>
<style>
  :root {
    color-scheme: light;
    --surface-0:#f4f4f2; --surface-1:#fcfcfb; --surface-2:#eeeeea;
    --line:#e2e2dd; --line-2:#d3d3cc;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#86857f; --ink-4:#a9a89f;
    --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a;
    --ghost:rgba(11,11,11,.085);
    --shadow:0 6px 24px rgba(0,0,0,.13);
    --shadow-lg:0 18px 48px rgba(0,0,0,.16);
    /* NOVELTY / heat scale — reads as DISCOVERY, not danger. foundational =
       calm slate; exotic = a violet→aqua "gem" accent. Never red. */
    --heat-foundational:#8f8e88;   /* muted slate — well-trodden ground */
    --heat-mid:#5c74c4;            /* cool indigo — getting interesting */
    --heat-gem:#7b52d6;            /* violet gem — rare find */
    --gem:#7b52d6; --gem-soft:rgba(123,82,214,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0:#101010; --surface-1:#191918; --surface-2:#232322;
      --line:#302f2c; --line-2:#403f3a;
      --ink-1:#f7f7f4; --ink-2:#bbbab0; --ink-3:#84837a; --ink-4:#5f5e58;
      --blue:#3987e5; --orange:#d95926; --aqua:#199e70;
      --ghost:rgba(247,247,244,.075);
      --shadow:0 6px 24px rgba(0,0,0,.5);
      --shadow-lg:0 18px 48px rgba(0,0,0,.6);
      --heat-foundational:#7a7972; --heat-mid:#7488e0; --heat-gem:#a986f5;
      --gem:#a986f5; --gem-soft:rgba(169,134,245,.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0:#101010; --surface-1:#191918; --surface-2:#232322;
    --line:#302f2c; --line-2:#403f3a;
    --ink-1:#f7f7f4; --ink-2:#bbbab0; --ink-3:#84837a; --ink-4:#5f5e58;
    --blue:#3987e5; --orange:#d95926; --aqua:#199e70;
    --ghost:rgba(247,247,244,.075);
    --shadow:0 6px 24px rgba(0,0,0,.5);
    --shadow-lg:0 18px 48px rgba(0,0,0,.6);
    --heat-foundational:#7a7972; --heat-mid:#7488e0; --heat-gem:#a986f5;
    --gem:#a986f5; --gem-soft:rgba(169,134,245,.14);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  html{overflow-x:clip}
  body{
    background:var(--surface-0); color:var(--ink-1);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:clip;
    overflow-wrap:break-word;
  }
  a{color:inherit}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

  header{
    max-width:1240px;margin:0 auto;padding:22px 24px 0;
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;
  }
  h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.015em}
  h1 a{text-decoration:none}
  h1 a:hover{color:var(--blue)}
  .sub{color:var(--ink-2);font-size:13px;margin:0}
  .sub b{color:var(--ink-1);font-weight:600;font-variant-numeric:tabular-nums}
  .hgrow{flex:1 1 auto}
  #themeToggle{
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
    border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;
  }
  #themeToggle:hover{color:var(--ink-1);border-color:var(--ink-4)}

  main{max-width:1240px;margin:0 auto;padding:14px 24px 72px}

  /* ---- breadcrumbs ---- */
  .crumbs{font-size:13px;color:var(--ink-3);margin:6px 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .crumbs a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid transparent}
  .crumbs a:hover{color:var(--blue);border-bottom-color:var(--blue)}
  .crumbs .sep{color:var(--ink-4)}
  .crumbs .here{color:var(--ink-1);font-weight:600}

  /* ---- landing search ---- */
  .searchwrap{margin:14px 0 6px}
  #q{
    width:100%;max-width:680px;display:block;
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-1);
    border-radius:12px;padding:12px 16px;font:inherit;font-size:15.5px;
    outline:none;box-shadow:none;
  }
  #q:focus{border-color:var(--blue)}
  #q::placeholder{color:var(--ink-4)}
  .hint{font-size:12px;color:var(--ink-4);margin:6px 2px 0}
  kbd{
    font:11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;
    padding:2px 5px;background:var(--surface-1);color:var(--ink-3);
  }

  .secthead{
    display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;
  }
  .secthead h2{margin:0;font-size:14px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
  .secthead .n{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* ---- door grid ---- */
  .grid{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  }
  .card{
    display:flex;flex-direction:column;gap:6px;
    background:var(--surface-1);border:1px solid var(--line);border-radius:12px;
    padding:14px 15px 12px;text-decoration:none;cursor:pointer;
    transition:border-color .1s, transform .06s;
  }
  .card:hover{border-color:var(--blue)}
  .card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .card-name{font-size:15px;font-weight:640;letter-spacing:-.01em;line-height:1.3}
  .card-gloss{
    margin:0;font-size:12.8px;color:var(--ink-2);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-count{margin-top:auto;padding-top:6px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  /* door mix indicator: 3-segment bar (foundational|mid|rare) + a tier label.
     frontier = gem accent, core = calm neutral. */
  .mix{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .mixbar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2)}
  .mixbar i{height:100%;display:block}
  .mixbar .f{background:var(--heat-foundational)}
  .mixbar .m{background:var(--heat-mid)}
  .mixbar .r{background:var(--gem)}
  .tierlab{font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .tierlab .dot{width:7px;height:7px;border-radius:999px;flex:none}
  .tier-core .dot{background:var(--heat-foundational)} .tier-core{color:var(--ink-3)}
  .tier-mixed .dot{background:var(--heat-mid)} .tier-mixed{color:var(--ink-3)}
  .tier-frontier .dot{background:var(--gem)} .tier-frontier{color:var(--gem)}
  .card.singletons{border-style:dashed;border-color:var(--line-2)}
  .card.singletons:hover{border-color:var(--orange)}
  .card.singletons .card-name{color:var(--ink-2)}

  /* ---- entry hit list (search) & door member list ---- */
  .rows{display:flex;flex-direction:column;gap:8px}
  .mrow{
    position:relative;display:block;background:var(--surface-1);
    border:1px solid var(--line);border-radius:10px;
    padding:11px 14px 11px 18px;text-decoration:none;cursor:pointer;overflow:hidden;
  }
  .mrow:hover{border-color:var(--blue)}
  .mrow:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  /* heat rail: a left edge that runs foundational-slate -> gem-violet as a
     technique gets rarer, so a door's exotic members pop out of the list.
     --h (0..1) and --hcol are set inline per row. */
  .mrow::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--hcol,var(--heat-foundational));
    opacity:calc(.35 + .65*var(--h,0));
  }
  .mrow.hot{border-color:color-mix(in srgb,var(--gem) 34%,var(--line));background:var(--gem-soft)}
  .mrow.hot:hover{border-color:var(--gem)}
  .heatpip{
    display:inline-block;font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
    border-radius:999px;padding:1px 7px;border:1px solid var(--hcol);color:var(--hcol);
    background:transparent;
  }
  .mname{font-size:14.5px;font-weight:640;letter-spacing:-.01em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .mmech{
    margin:3px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .doortag{
    font-size:11px;font-weight:500;color:var(--ink-3);
    border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;background:var(--surface-2);
  }
  .empty{color:var(--ink-3);font-size:13.5px;padding:18px 4px}

  /* ---- badges ---- */
  .badge{
    display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    border-radius:999px;padding:2px 8px;border:1px solid var(--line-2);color:var(--ink-3);background:var(--surface-2);
  }
  .badge.risk-low{color:var(--aqua);border-color:var(--aqua)}
  .badge.risk-medium{color:var(--ink-2);border-color:var(--ink-4)}
  .badge.risk-high{color:var(--orange);border-color:var(--orange)}

  /* ---- door view ---- */
  .doorhead h2{margin:0 0 4px;font-size:22px;font-weight:650;letter-spacing:-.015em}
  .doorgloss{margin:0 0 4px;font-size:14.5px;color:var(--ink-2);max-width:760px;line-height:1.55}
  .doorcount{font-size:12.5px;color:var(--ink-3);margin:0 0 16px;font-variant-numeric:tabular-nums}
  #memberFilter{
    width:100%;max-width:420px;display:block;margin:0 0 12px;
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-1);
    border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;outline:none;
  }
  #memberFilter:focus{border-color:var(--blue)}

  /* ---- entry view ---- */
  .entry{max-width:820px}
  .entry h2{margin:0 0 6px;font-size:24px;font-weight:660;letter-spacing:-.018em;line-height:1.2}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 22px;font-size:12px;color:var(--ink-3)}
  .meta .fam{color:var(--ink-3)}
  /* entry heat readout — the "how rare is this" banner + raw evidence */
  .heatband{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
    margin:0 0 22px;padding:10px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface-1);
  }
  .heatband.hot{border-color:color-mix(in srgb,var(--gem) 40%,var(--line));background:var(--gem-soft)}
  .heatchip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;color:var(--hcol)}
  .heatchip .gemdot{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);background:var(--hcol)}
  .heatmeter{flex:1 1 160px;min-width:120px;height:6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);overflow:hidden}
  .heatmeter i{display:block;height:100%;background:linear-gradient(90deg,var(--heat-foundational),var(--hcol))}
  .reach{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .reach b{color:var(--ink-1);font-weight:640}
  .sect{margin:0 0 22px}
  .sect .lab{
    font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-3);margin:0 0 6px;
  }
  .job{font-size:16.5px;line-height:1.6;color:var(--ink-1);margin:0}
  .tell{font-size:14.5px;line-height:1.6;color:var(--ink-2);margin:0}
  .ex{
    background:var(--surface-1);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;
  }
  .ex .facet{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:0 0 8px}
  .ex blockquote{
    margin:0;padding:0 0 0 12px;border-left:3px solid var(--line-2);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:13px;line-height:1.6;color:var(--ink-1);white-space:pre-wrap;
  }
  .ex .move{margin:10px 0 0;font-size:13px;color:var(--ink-1)}
  .ex .move b{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-right:6px}
  .ex .move span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .ex .src{margin:10px 0 0;font-size:12px;color:var(--ink-3)}

  details.confuse{
    border:1px solid var(--line);border-radius:12px;background:var(--surface-1);
  }
  details.confuse summary{
    cursor:pointer;list-style:none;padding:12px 16px;
    font-size:13px;font-weight:650;color:var(--ink-1);
    display:flex;align-items:center;gap:8px;
  }
  details.confuse summary::-webkit-details-marker{display:none}
  details.confuse summary::before{content:"▸";color:var(--ink-3);font-size:11px;transition:transform .12s}
  details.confuse[open] summary::before{transform:rotate(90deg)}
  details.confuse summary .n{font-weight:500;color:var(--ink-3);font-size:12px}
  .cue{
    border-top:1px solid var(--line);padding:12px 16px 14px;
  }
  .cue .vs{font-size:13.5px;font-weight:640;margin:0 0 5px}
  .cue .vs a{color:var(--blue);text-decoration:none}
  .cue .vs a:hover{text-decoration:underline}
  .cue .vs .vslab{color:var(--orange);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;margin-right:7px}
  .cue p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-2)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
    border-radius:999px;padding:5px 12px;font-size:12.5px;text-decoration:none;cursor:pointer;
  }
  .chip:hover{color:var(--blue);border-color:var(--blue)}
  .chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .loading,.fatal{padding:60px 0;color:var(--ink-3);font-size:14px;max-width:640px}
  .fatal b{color:var(--ink-1)}
  .fatal code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;
  }

  @media (max-width:560px){
    header{padding:16px 16px 0}
    main{padding:10px 16px 56px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
    .entry h2{font-size:20px}
  }
</style>

<header>
  <h1><a href="#/">Operator Formulary</a></h1>
  <p class="sub" id="subline">981 techniques of influence across 192 families</p>
  <div class="hgrow"></div>
  <button id="themeToggle" type="button" aria-label="Toggle color theme">◐ theme</button>
</header>
<main id="view"><div class="loading">Loading formulary…</div></main>

<script>
'use strict';

/* ============ theme ============ */
(function(){
  var KEY='of-theme', root=document.documentElement;
  try{ var saved=localStorage.getItem(KEY); if(saved==='light'||saved==='dark') root.setAttribute('data-theme',saved); }catch(e){}
  document.getElementById('themeToggle').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    if(!cur) cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    var next=(cur==='dark')?'light':'dark';
    root.setAttribute('data-theme',next);
    try{ localStorage.setItem(KEY,next); }catch(e){}
  });
})();

/* ============ state ============ */
var S={ ready:false, byId:{}, doors:[], doorById:{}, singletons:[], seeAlso:{}, contrasts:{}, nodes:[] };
var searchQuery='';       // persists across landing re-entry
var memberFilter='';      // singleton-view local filter

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function titleCase(kebab){
  return String(kebab||'').split('-').map(function(w){
    return w? w.charAt(0).toUpperCase()+w.slice(1) : w;
  }).join(' ');
}

/* ============ data load ============ */
function loadData(){
  function ingest(d){ build(d); route(); }
  function fail(){
    document.getElementById('view').innerHTML=
      '<div class="fatal"><b>Could not load <code>graph.json</code>.</b><br><br>'+
      'If you opened this page directly from disk (a <code>file://</code> URL), your browser is blocking '+
      'local data reads. Serve the folder instead:<br><br>'+
      '<code>python3 -m http.server</code> &nbsp;then open&nbsp; <code>http://localhost:8000/</code><br><br>'+
      'On GitHub Pages or any web server this works as-is.</div>';
  }
  if(window.fetch){
    fetch('graph.json').then(function(r){
      if(!r.ok) throw new Error(r.status); return r.json();
    }).then(ingest).catch(function(){ xhrLoad(ingest,fail); });
  } else xhrLoad(ingest,fail);
}
function xhrLoad(ok,bad){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','graph.json');
    x.onload=function(){
      try{ ok(JSON.parse(x.responseText)); }catch(e){ bad(); }
    };
    x.onerror=bad;
    x.send();
  }catch(e){ bad(); }
}

function build(d){
  var i,n,e;
  S.nodes=d.nodes||[];
  S.heatMax=0;
  for(i=0;i<S.nodes.length;i++){
    n=S.nodes[i];
    n._title=titleCase(n.name);
    n._search=(n.name+' '+n.name.replace(/-/g,' ')+' '+(n.mech||'')).toLowerCase();
    S.byId[n.id]=n;
    if(typeof n.heat==='number'&&n.heat>S.heatMax) S.heatMax=n.heat;
  }
  if(!S.heatMax) S.heatMax=1; // guard against divide-by-zero / all-null heat
  // doors: keys are STRING ids; node.door is an INT — normalize via String()
  var doorsRaw=d.doors||{};
  var ids=Object.keys(doorsRaw);
  for(i=0;i<ids.length;i++){
    var did=ids[i], dr=doorsRaw[did];
    var door={ id:did, name:dr.name, gloss:dr.gloss||'', members:[],
               tier:dr.tier||null, mix:dr.mix||null,
               _title:titleCase(dr.name),
               _search:(dr.name+' '+dr.name.replace(/-/g,' ')+' '+(dr.gloss||'')).toLowerCase() };
    S.doorById[did]=door;
    S.doors.push(door);
  }
  for(i=0;i<S.nodes.length;i++){
    n=S.nodes[i];
    if(n.door==null){ S.singletons.push(n); continue; }
    var dkey=String(n.door);
    if(S.doorById[dkey]) S.doorById[dkey].members.push(n);
    else S.singletons.push(n); // door id with no doors{} entry — treat as unhoused
  }
  S.doors.sort(function(a,b){ return a.name<b.name?-1:a.name>b.name?1:0; });
  S.doors.forEach(function(dd){ dd.members.sort(byName); });
  S.singletons.sort(byName);

  // edges: see_also -> chips; contrasts_with -> "don't confuse with" (note is the
  // bare decision procedure). distinct_from is intentionally not surfaced.
  var edges=d.edges||[];
  for(i=0;i<edges.length;i++){
    e=edges[i];
    if(!S.byId[e.s]||!S.byId[e.t]) continue;
    if(e.k==='see_also'){ addEdge(S.seeAlso,e.s,e.t,e.n); addEdge(S.seeAlso,e.t,e.s,e.n); }
    else if(e.k==='contrasts_with'){ addEdge(S.contrasts,e.s,e.t,e.n); addEdge(S.contrasts,e.t,e.s,e.n); }
  }
  Object.keys(S.seeAlso).forEach(function(k){ S.seeAlso[k].sort(byOtherName); });
  Object.keys(S.contrasts).forEach(function(k){ S.contrasts[k].sort(byOtherName); });

  S.ready=true;
  document.getElementById('subline').innerHTML=
    '<b>'+S.doors.length+'</b> doors · <b>'+S.nodes.length+'</b> techniques · <b>'+S.singletons.length+'</b> singletons';
  document.title='Operator Formulary — 981 techniques of influence across 192 families';
}
function byName(a,b){ return a.name<b.name?-1:a.name>b.name?1:0; }
function byOtherName(a,b){ var x=S.byId[a.o].name,y=S.byId[b.o].name; return x<y?-1:x>y?1:0; }
function addEdge(map,from,to,note){
  var arr=map[from]||(map[from]=[]);
  for(var i=0;i<arr.length;i++) if(arr[i].o===to) return; // dedupe pairs
  arr.push({o:to,n:note||''});
}

/* ============ router ============ */
function route(){
  if(!S.ready) return;
  var h=location.hash.replace(/^#\/?/,'');
  var parts=h.split('/');
  var view=document.getElementById('view');
  memberFilter='';
  if(parts[0]==='door'&&S.doorById[parts[1]])      renderDoor(view,S.doorById[parts[1]]);
  else if(parts[0]==='singletons')                 renderSingletons(view);
  else if(parts[0]==='entry'&&S.byId[+parts[1]])   renderEntry(view,S.byId[+parts[1]]);
  else                                             renderLanding(view);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ============ landing ============ */
function renderLanding(view){
  view.innerHTML=
    '<div class="searchwrap">'+
      '<input id="q" type="search" autocomplete="off" spellcheck="false" '+
        'placeholder="Search '+S.doors.length+' doors and '+S.nodes.length+' techniques…" '+
        'value="'+esc(searchQuery)+'" aria-label="Search doors and techniques">'+
      '<p class="hint"><kbd>/</kbd> search &nbsp; <kbd>Esc</kbd> up a level &nbsp; <kbd>←→↑↓</kbd> move between cards</p>'+
    '</div>'+
    '<div id="results"></div>';
  var q=document.getElementById('q');
  q.addEventListener('input',function(){ searchQuery=q.value; renderResults(); });
  renderResults();
}

function renderResults(){
  var box=document.getElementById('results');
  if(!box) return;
  var q=searchQuery.trim().toLowerCase();
  var html='';
  if(!q){
    html+='<div class="secthead"><h2>Doors</h2><span class="n">'+S.doors.length+' groups of related techniques</span></div>';
    html+='<div class="grid">';
    for(var i=0;i<S.doors.length;i++) html+=doorCard(S.doors[i]);
    html+=singletonsCard();
    html+='</div>';
  }else{
    var doors=S.doors.filter(function(d){ return d._search.indexOf(q)>=0; });
    var hits=S.nodes.filter(function(n){ return n._search.indexOf(q)>=0; });
    html+='<div class="secthead"><h2>Doors</h2><span class="n">'+doors.length+' match</span></div>';
    if(doors.length){
      html+='<div class="grid">';
      for(var j=0;j<doors.length;j++) html+=doorCard(doors[j]);
      html+='</div>';
    }else html+='<div class="empty">No doors match “'+esc(searchQuery.trim())+'”.</div>';
    var CAP=120, shown=hits.slice(0,CAP);
    html+='<div class="secthead"><h2>Techniques</h2><span class="n">'+hits.length+' match'+
      (hits.length>CAP?' · showing first '+CAP:'')+'</span></div>';
    if(hits.length){
      html+='<div class="rows">';
      for(var k=0;k<shown.length;k++) html+=entryRow(shown[k],true);
      html+='</div>';
    }else html+='<div class="empty">No techniques match “'+esc(searchQuery.trim())+'”.</div>';
  }
  box.innerHTML=html;
}

/* heat helpers — normalize node.heat to 0..1 against the observed max, then
   pick a gem-vs-slate accent. Discovery, never danger: slate -> indigo -> violet. */
function heatNorm(n){
  var h=(typeof n.heat==='number')?n.heat:0;
  var v=h/(S.heatMax||1);
  return v<0?0:v>1?1:v;
}
function heatColor(v){
  // slate -> indigo -> violet ramp, computed so the gradient is smooth.
  var stops=[[143,142,136],[92,116,196],[123,82,214]]; // matches --heat-* light tokens
  var seg=v<=0.5? [stops[0],stops[1],v/0.5] : [stops[1],stops[2],(v-0.5)/0.5];
  var a=seg[0],b=seg[1],t=seg[2];
  var r=Math.round(a[0]+(b[0]-a[0])*t), g=Math.round(a[1]+(b[1]-a[1])*t), bl=Math.round(a[2]+(b[2]-a[2])*t);
  return 'rgb('+r+','+g+','+bl+')';
}
function heatLabel(v){ return v>=0.66?'deep cut':v>=0.33?'uncommon':'foundational'; }

function doorCard(d){
  return '<a class="card knav" href="#/door/'+d.id+'">'+
    '<div class="card-name">'+esc(d._title)+'</div>'+
    '<p class="card-gloss">'+esc(d.gloss)+'</p>'+
    '<div class="card-count">'+d.members.length+' technique'+(d.members.length===1?'':'s')+'</div>'+
    mixIndicator(d)+
  '</a>';
}
function mixIndicator(d){
  var m=d.mix, tier=d.tier;
  if(!m&&!tier) return '';
  var f=(m&&m.foundational)||0, mid=(m&&m.mid)||0, r=(m&&m.rare)||0, tot=f+mid+r;
  var bar='';
  if(tot>0){
    bar='<div class="mixbar" role="img" aria-label="'+f+' foundational, '+mid+' mid, '+r+' rare">'+
      (f?'<i class="f" style="width:'+(100*f/tot)+'%"></i>':'')+
      (mid?'<i class="m" style="width:'+(100*mid/tot)+'%"></i>':'')+
      (r?'<i class="r" style="width:'+(100*r/tot)+'%"></i>':'')+
    '</div>';
  }
  var tlab={core:'mostly foundational',mixed:'mixed',frontier:'mostly frontier'};
  var lab=tier? '<div class="tierlab tier-'+esc(tier)+'"><span class="dot"></span>'+esc(tlab[tier]||tier)+'</div>' : '';
  return '<div class="mix">'+bar+lab+'</div>';
}
function singletonsCard(){
  return '<a class="card singletons knav" href="#/singletons">'+
    '<div class="card-name">Singletons</div>'+
    '<p class="card-gloss">One-of-a-kind techniques that don’t share a door with anything else. Browse the unhoused.</p>'+
    '<div class="card-count">'+S.singletons.length+' techniques</div>'+
  '</a>';
}
function entryRow(n,withDoor){
  var tag='';
  if(withDoor){
    var d=(n.door!=null)?S.doorById[String(n.door)]:null;
    tag='<span class="doortag">'+(d?esc(d._title):'Singleton')+'</span>';
  }
  var v=heatNorm(n), col=heatColor(v), hot=v>=0.66;
  var pip=hot? ' <span class="heatpip">'+esc(heatLabel(v))+'</span>' : '';
  return '<a class="mrow knav'+(hot?' hot':'')+'" href="#/entry/'+n.id+'" '+
      'style="--h:'+v.toFixed(3)+';--hcol:'+col+'">'+
    '<div class="mname">'+esc(n._title)+' '+tag+pip+riskBadge(n)+'</div>'+
    '<p class="mmech">'+esc(n.mech||'')+'</p>'+
  '</a>';
}
function riskBadge(n){
  return n.risk? ' <span class="badge risk-'+esc(n.risk)+'">'+esc(n.risk)+'</span>' : '';
}

/* ============ door view ============ */
function renderDoor(view,d){
  var html=crumbs([['#/','All doors']],d._title)+
    '<div class="doorhead"><h2>'+esc(d._title)+'</h2>'+
    '<p class="doorgloss">'+esc(d.gloss)+'</p>'+
    '<p class="doorcount">'+d.members.length+' technique'+(d.members.length===1?'':'s')+'</p></div>'+
    '<div class="rows">';
  for(var i=0;i<d.members.length;i++) html+=entryRow(d.members[i],false);
  html+='</div>';
  view.innerHTML=html;
}

function renderSingletons(view){
  var html=crumbs([['#/','All doors']],'Singletons')+
    '<div class="doorhead"><h2>Singletons</h2>'+
    '<p class="doorgloss">Techniques that don’t share a door with anything else — each is the only entry of its kind.</p>'+
    '<p class="doorcount">'+S.singletons.length+' techniques</p></div>'+
    '<input id="memberFilter" type="search" autocomplete="off" spellcheck="false" placeholder="Filter singletons…" aria-label="Filter singletons">'+
    '<div class="rows" id="singletonRows"></div>';
  view.innerHTML=html;
  var inp=document.getElementById('memberFilter');
  inp.addEventListener('input',function(){ memberFilter=inp.value; paintSingletons(); });
  paintSingletons();
}
function paintSingletons(){
  var box=document.getElementById('singletonRows');
  if(!box) return;
  var q=memberFilter.trim().toLowerCase();
  var list=q? S.singletons.filter(function(n){ return n._search.indexOf(q)>=0; }) : S.singletons;
  var html='';
  for(var i=0;i<list.length;i++) html+=entryRow(list[i],false);
  box.innerHTML=html||'<div class="empty">No singletons match.</div>';
}

/* ============ entry view ============ */
function renderEntry(view,n){
  var d=(n.door!=null)?S.doorById[String(n.door)]:null;
  var trail=d? [['#/','All doors'],['#/door/'+d.id,d._title]]
             : [['#/','All doors'],['#/singletons','Singletons']];
  var html=crumbs(trail,n._title)+'<article class="entry">';

  // header + badges
  html+='<h2>'+esc(n._title)+'</h2><div class="meta">';
  html+='<span class="fam">'+esc(titleCase(n.family||''))+' · '+esc(n.macroclass||'')+'</span>';
  if(n.risk) html+='<span class="badge risk-'+esc(n.risk)+'">risk: '+esc(n.risk)+'</span>';
  if(n.consent) html+='<span class="badge">consent</span>';
  if(n.bounded) html+='<span class="badge">bounded</span>';
  html+='</div>';

  // novelty heat band — how rare/exotic, with the raw reach evidence
  var v=heatNorm(n), col=heatColor(v), hot=v>=0.66;
  var reach=(typeof n.reach==='number')?n.reach:null;
  html+='<div class="heatband'+(hot?' hot':'')+'" style="--hcol:'+col+'">';
  html+='<span class="heatchip"><span class="gemdot"></span>'+esc(heatLabel(v))+'</span>';
  html+='<span class="heatmeter" aria-hidden="true"><i style="width:'+(Math.max(6,v*100)).toFixed(0)+'%"></i></span>';
  if(reach!=null) html+='<span class="reach">in <b>'+reach+'</b> script'+(reach===1?'':'s')+'</span>';
  html+='</div>';

  // a) THE JOB
  html+='<section class="sect"><p class="lab">The job</p><p class="job">'+esc(n.mech||'')+'</p></section>';

  // b) THE TELL
  if(n.disc) html+='<section class="sect"><p class="lab">The tell</p><p class="tell">'+esc(n.disc)+'</p></section>';

  // c) EXAMPLE (first ex[] item)
  var ex=(n.ex&&n.ex.length)?n.ex[0]:null;
  if(ex&&ex.t){
    html+='<section class="sect"><p class="lab">Example</p><div class="ex">';
    if(ex.f) html+='<p class="facet">'+esc(ex.f)+'</p>';
    html+='<blockquote>'+esc(ex.t)+'</blockquote>';
    if(ex.m) html+='<p class="move"><b>The move</b><span>'+esc(ex.m)+'</span></p>';
    if(ex.s) html+='<p class="src">'+esc(ex.s)+'</p>';
    html+='</div></section>';
  }

  // d) DON'T CONFUSE WITH (collapsed) — contrasts_with notes ARE the decision procedure
  var cons=S.contrasts[n.id]||[];
  if(cons.length){
    html+='<section class="sect"><details class="confuse"><summary>Don’t confuse with'+
      ' <span class="n">'+cons.length+' near-mis'+(cons.length===1?'s':'ses')+', each with a decision procedure</span></summary>';
    for(var i=0;i<cons.length;i++){
      var o=S.byId[cons[i].o];
      html+='<div class="cue"><p class="vs"><span class="vslab">vs</span>'+
        '<a href="#/entry/'+o.id+'">'+esc(o._title)+'</a></p>';
      if(cons[i].n) html+='<p>'+esc(cons[i].n)+'</p>';
      html+='</div>';
    }
    html+='</details></section>';
  }

  // f) see also chips
  var sib=S.seeAlso[n.id]||[];
  if(sib.length){
    html+='<section class="sect"><p class="lab">See also</p><div class="chips">';
    for(var j=0;j<sib.length;j++){
      var t=S.byId[sib[j].o];
      html+='<a class="chip knav" href="#/entry/'+t.id+'" title="'+esc(sib[j].n)+'">'+esc(t._title)+'</a>';
    }
    html+='</div></section>';
  }

  html+='</article>';
  view.innerHTML=html;
}

function crumbs(trail,here){
  var html='<nav class="crumbs" aria-label="Breadcrumb">';
  for(var i=0;i<trail.length;i++){
    html+='<a href="'+trail[i][0]+'">'+esc(trail[i][1])+'</a><span class="sep">›</span>';
  }
  html+='<span class="here">'+esc(here)+'</span></nav>';
  return html;
}

/* ============ keyboard ============ */
document.addEventListener('keydown',function(e){
  if(!S.ready) return;
  var tgt=e.target, inInput=tgt&&(tgt.tagName==='INPUT'||tgt.tagName==='TEXTAREA');

  // "/" — focus the landing search (jump to landing first if elsewhere)
  if(e.key==='/'&&!inInput){
    e.preventDefault();
    var q=document.getElementById('q');
    if(q){ q.focus(); q.select(); }
    else{
      location.hash='#/';
      setTimeout(function(){ var qq=document.getElementById('q'); if(qq){ qq.focus(); qq.select(); } },0);
    }
    return;
  }

  // Esc — clear/leave search first, else go up one level
  if(e.key==='Escape'){
    if(inInput){
      if(tgt.value){
        tgt.value='';
        if(tgt.id==='q'){ searchQuery=''; renderResults(); }
        if(tgt.id==='memberFilter'){ memberFilter=''; paintSingletons(); }
      }else tgt.blur();
      return;
    }
    var h=location.hash.replace(/^#\/?/,''), parts=h.split('/');
    if(parts[0]==='entry'){
      var node=S.byId[+parts[1]];
      if(node&&node.door!=null&&S.doorById[String(node.door)]) location.hash='#/door/'+node.door;
      else location.hash='#/singletons';
    }
    else if(parts[0]==='door'||parts[0]==='singletons') location.hash='#/';
    return;
  }

  // arrows — roving focus across visible cards/rows/chips
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){
    if(inInput) return;
    var items=Array.prototype.slice.call(document.querySelectorAll('.knav'));
    if(!items.length) return;
    var cur=items.indexOf(document.activeElement);
    if(cur<0){ items[0].focus(); e.preventDefault(); return; }
    var next=-1;
    if(e.key==='ArrowLeft')  next=cur-1;
    if(e.key==='ArrowRight') next=cur+1;
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      next=nearestVertical(items,cur,e.key==='ArrowDown'?1:-1);
    }
    if(next>=0&&next<items.length){
      items[next].focus();
      items[next].scrollIntoView({block:'nearest'});
      e.preventDefault();
    }
  }
});

function nearestVertical(items,cur,dir){
  var me=items[cur].getBoundingClientRect();
  var myTop=me.top+window.scrollY, myX=me.left+me.width/2;
  var best=-1,bestDy=Infinity,bestDx=Infinity;
  for(var i=0;i<items.length;i++){
    if(i===cur) continue;
    var r=items[i].getBoundingClientRect();
    var top=r.top+window.scrollY;
    var dy=(top-myTop)*dir;
    if(dy<=2) continue; // must be strictly in the requested direction
    var dx=Math.abs(r.left+r.width/2-myX);
    if(dy<bestDy-2||(Math.abs(dy-bestDy)<=2&&dx<bestDx)){ best=i; bestDy=dy; bestDx=dx; }
  }
  return best;
}

loadData();
</script>
