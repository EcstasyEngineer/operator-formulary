<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator Formulary</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='5' cy='8' r='2.6' fill='%232361ae'/%3E%3Ccircle cx='11.5' cy='4.5' r='1.9' fill='%23888'/%3E%3Ccircle cx='11.5' cy='11.5' r='1.9' fill='%23888'/%3E%3Cpath d='M6.8 7.2 10 5.1M6.8 8.8 10 10.9' stroke='%23888' stroke-width='1.1'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --surface-0:#f6f6f4; --surface-1:#fdfdfc; --surface-2:#efefeb;
    --line:#e2e2dd; --line-2:#d2d2cb;
    --ink-1:#101010; --ink-2:#4e4d4a; --ink-3:#83827c; --ink-4:#aaa9a1;
    --accent:#2361ae; --accent-soft:rgba(35,97,174,.09);
    --warn:#a05a1f; --high:#a03a2e;
    --shadow:0 6px 24px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242423;
      --line:#2f2f2c; --line-2:#403f3a;
      --ink-1:#f4f4f1; --ink-2:#b8b7ae; --ink-3:#83827a; --ink-4:#5e5d57;
      --accent:#5b93d8; --accent-soft:rgba(91,147,216,.13);
      --warn:#c98a4b; --high:#c9685a;
      --shadow:0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242423;
    --line:#2f2f2c; --line-2:#403f3a;
    --ink-1:#f4f4f1; --ink-2:#b8b7ae; --ink-3:#83827a; --ink-4:#5e5d57;
    --accent:#5b93d8; --accent-soft:rgba(91,147,216,.13);
    --warn:#c98a4b; --high:#c9685a;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  html{overflow-x:clip}
  body{
    background:var(--surface-0); color:var(--ink-1);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:clip; overflow-wrap:break-word;
  }
  a{color:inherit}
  .serif{font-family:Charter,Georgia,"Times New Roman",serif}

  header{
    max-width:1200px;margin:0 auto;padding:22px 24px 0;
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;
  }
  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
  h1 a{text-decoration:none}
  h1 a:hover{color:var(--accent)}
  .sub{color:var(--ink-3);font-size:13px;margin:0;font-variant-numeric:tabular-nums}
  .hgrow{flex:1 1 auto}
  .hbtn{
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
    border-radius:6px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;
    text-decoration:none;
  }
  .hbtn:hover{color:var(--ink-1);border-color:var(--ink-4)}
  .hbtn.on{border-color:var(--accent);color:var(--accent)}

  main{max-width:1200px;margin:0 auto;padding:16px 24px 72px}

  .crumbs{font-size:13px;color:var(--ink-3);margin:4px 0 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .crumbs a{text-decoration:none}
  .crumbs a:hover{color:var(--accent)}
  .crumbs .sep{color:var(--ink-4)}
  .crumbs .here{color:var(--ink-2)}

  .searchwrap{margin:10px 0 20px;max-width:640px}
  input[type=search]{
    width:100%;border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-1);
    border-radius:8px;padding:10px 14px;font:inherit;font-size:14.5px;
  }
  input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .hint{color:var(--ink-4);font-size:12px;margin:7px 2px 0}
  kbd{
    font:11px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line-2);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface-1);color:var(--ink-3);
  }

  .secthead{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
  .secthead h2{margin:0;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
  .secthead .n{color:var(--ink-4);font-size:12.5px;font-variant-numeric:tabular-nums}

  /* genus index: compact reference rows */
  .gxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:2px 28px}
  .gx{
    display:flex;align-items:baseline;gap:9px;padding:7px 8px;border-radius:6px;
    text-decoration:none;border-bottom:1px solid var(--line);
  }
  .gx:hover{background:var(--accent-soft)}
  .gx:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .gx .name{font-weight:570;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gx .cnt{color:var(--ink-4);font-size:12px;font-variant-numeric:tabular-nums;margin-left:auto}

  .rows{display:flex;flex-direction:column}
  .mrow{
    display:block;padding:11px 10px;border-bottom:1px solid var(--line);
    text-decoration:none;border-radius:6px;
  }
  .mrow:hover{background:var(--accent-soft)}
  .mrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .mname{font-weight:600;font-size:14.5px}
  .mmech{
    color:var(--ink-2);font-size:13px;margin:3px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .gtag{
    display:inline-block;margin-left:8px;color:var(--ink-3);font-size:11.5px;
    border:1px solid var(--line-2);border-radius:4px;padding:0 6px;vertical-align:1px;
  }
  .badge{
    display:inline-block;margin-left:8px;font-size:10.5px;font-weight:650;letter-spacing:.05em;
    text-transform:uppercase;border-radius:4px;padding:1px 6px;vertical-align:1px;
    border:1px solid var(--line-2);color:var(--ink-3);
  }
  .badge.risk-medium{color:var(--warn);border-color:var(--warn)}
  .badge.risk-high{color:var(--high);border-color:var(--high)}
  .att{color:var(--ink-4);font-size:12px;margin-left:8px;font-variant-numeric:tabular-nums}

  .pagehead{margin:2px 0 6px}
  .pagehead h2{margin:0 0 4px;font-size:24px;letter-spacing:-.01em}
  .pagehead .gloss{color:var(--ink-2);font-size:14.5px;margin:0;max-width:70ch}
  .pagehead .count{color:var(--ink-4);font-size:12.5px;margin:6px 0 0;font-variant-numeric:tabular-nums}

  /* entry page */
  article.entry{max-width:760px}
  .entry h2{margin:0 0 6px;font-size:26px;letter-spacing:-.012em}
  .entry .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-3);font-size:13px;margin:0 0 18px}
  .entry .meta .fam{font-variant:all-small-caps;letter-spacing:.04em}
  .sect{margin:0 0 20px}
  .sect .lab{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  .sect p.body{margin:0;font-size:15.5px;line-height:1.62;color:var(--ink-1)}
  .sect p.body+p.body{margin-top:8px}
  .ex blockquote{
    margin:0;padding:12px 16px;border-left:3px solid var(--line-2);background:var(--surface-1);
    border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);
  }
  .ex .facet{color:var(--ink-3);font-size:12px;margin:0 0 6px}
  .ex .move{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}
  .ex .move b{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-right:6px}
  details.confuse{border:1px solid var(--line);border-radius:8px;background:var(--surface-1)}
  details.confuse summary{
    cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline;
  }
  details.confuse summary::-webkit-details-marker{display:none}
  details.confuse summary::before{content:"▸";color:var(--ink-3);font-size:11px;transition:transform .12s}
  details.confuse[open] summary::before{transform:rotate(90deg)}
  details.confuse summary .n{color:var(--ink-4);font-weight:400;font-size:12.5px}
  .cue{padding:2px 16px 12px;font-size:13.5px;color:var(--ink-2)}
  .cue p{margin:4px 0 0}
  .cue .vs{margin:0}
  .cue .vs a{font-weight:600;text-decoration:none}
  .cue .vs a:hover{color:var(--accent)}
  .cue .vs .vslab{color:var(--ink-3);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;margin-right:7px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
    border-radius:6px;padding:4px 11px;font-size:12.5px;text-decoration:none;cursor:pointer;
  }
  .chip:hover{color:var(--accent);border-color:var(--accent)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip .st{color:var(--ink-4);font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
  .chip.mut{opacity:.55}
  .seqnote{color:var(--ink-4);font-size:12px;margin:6px 2px 0}

  /* graph view */
  .gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
  .gmode{border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
         border-radius:6px;padding:5px 13px;font:inherit;font-size:12.5px;cursor:pointer}
  .gmode.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .gmode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #gsearch{width:220px;border-radius:6px;padding:5px 12px;font-size:12.5px;border:1px solid var(--line-2);
           background:var(--surface-1);color:var(--ink-1)}
  #gsearch:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .ghint{color:var(--ink-4);font-size:12px;margin-left:auto}
  .gwrap{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface-1);
         overflow:hidden;height:calc(100vh - 220px);min-height:430px}
  #gcanvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #gcanvas.dragging{cursor:grabbing}
  .gpanel{position:absolute;top:10px;right:10px;width:300px;max-height:calc(100% - 20px);
          overflow:auto;background:var(--surface-1);border:1px solid var(--line-2);border-radius:10px;
          box-shadow:var(--shadow);padding:14px 16px;font-size:13px}
  .gpanel h3{margin:0 0 2px;font-size:15px;line-height:1.25}
  .gpanel .gdoor{color:var(--ink-3);font-size:12px;margin:0 0 8px}
  .gpanel .gmech{color:var(--ink-2);margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:5;
                 -webkit-box-orient:vertical;overflow:hidden}
  .gpanel .lab{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
               color:var(--ink-3);margin:12px 0 5px}
  .grow2{display:flex;align-items:baseline;gap:7px;padding:3px 2px;cursor:pointer;border-radius:5px}
  .grow2:hover .gname{color:var(--accent)}
  .grow2 .gname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow2 .gstat{color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .grow2.mut{opacity:.5}
  .gopen{display:inline-block;margin-top:10px;border:1px solid var(--line-2);border-radius:6px;
         padding:4px 12px;font-size:12px;text-decoration:none;color:var(--ink-2)}
  .gopen:hover{color:var(--accent);border-color:var(--accent)}
  .glegend{display:flex;flex-wrap:wrap;gap:5px 14px;color:var(--ink-3);font-size:12px;margin:9px 2px 0}
  .glegend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

  .loading,.fatal{padding:60px 0;color:var(--ink-3);font-size:14px;max-width:640px}
  .fatal b{color:var(--ink-1)}
  .fatal code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;
  }
  .empty{color:var(--ink-4);font-size:13.5px;padding:14px 4px}

  @media (max-width:640px){
    header{padding:16px 16px 0}
    main{padding:10px 16px 56px}
    .gxgrid{grid-template-columns:1fr}
    .gpanel{width:min(280px,80%)}
    .entry h2{font-size:21px}
  }
</style>

<header>
  <h1><a href="#/">Operator Formulary</a></h1>
  <p class="sub" id="subline">reference of influence techniques</p>
  <div class="hgrow"></div>
  <a id="graphLink" class="hbtn" href="#/graph">Graph</a>
  <button id="themeToggle" class="hbtn" type="button" aria-label="Toggle color theme">Theme</button>
</header>
<main id="view"><div class="loading">Loading…</div></main>

<script>
'use strict';

/* ============ theme ============ */
(function(){
  var KEY='of-theme', root=document.documentElement;
  try{ var saved=localStorage.getItem(KEY); if(saved==='light'||saved==='dark') root.setAttribute('data-theme',saved); }catch(e){}
  document.getElementById('themeToggle').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    if(!cur) cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    var next=(cur==='dark')?'light':'dark';
    root.setAttribute('data-theme',next);
    try{ localStorage.setItem(KEY,next); }catch(e){}
  });
})();

/* ============ state ============ */
/* payload keys are stable: doors/door = the genus tier (kind='genus' tags). The UI
   renders them as "genera" — do not rename the data fields. */
var S={ ready:false, byId:{}, genera:[], genusById:{}, singletons:[], seeAlso:{}, contrasts:{},
        nodes:[], next:{}, prev:{}, cooc:{}, nScripts:0 };
var searchQuery='', memberFilter='';

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function titleCase(kebab){
  return String(kebab||'').split('-').map(function(w){
    return w? w.charAt(0).toUpperCase()+w.slice(1) : w;
  }).join(' ');
}

/* ============ data load ============ */
function loadData(){
  function ingest(d){ build(d); route(); }
  function fail(){
    document.getElementById('view').innerHTML=
      '<div class="fatal"><b>Could not load <code>graph.json</code>.</b><br><br>'+
      'If you opened this page directly from disk (a <code>file://</code> URL), your browser is blocking '+
      'local data reads. Serve the folder instead:<br><br>'+
      '<code>python3 -m http.server</code> &nbsp;then open&nbsp; <code>http://localhost:8000/</code><br><br>'+
      'On GitHub Pages or any web server this works as-is.</div>';
  }
  if(window.fetch){
    fetch('graph.json').then(function(r){
      if(!r.ok) throw new Error(r.status); return r.json();
    }).then(ingest).catch(function(){ xhrLoad(ingest,fail); });
  } else xhrLoad(ingest,fail);
}
function xhrLoad(ok,bad){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','graph.json');
    x.onload=function(){ try{ ok(JSON.parse(x.responseText)); }catch(e){ bad(); } };
    x.onerror=bad;
    x.send();
  }catch(e){ bad(); }
}

function build(d){
  var i,n,e;
  S.nodes=d.nodes||[];
  for(i=0;i<S.nodes.length;i++){
    n=S.nodes[i];
    n._title=titleCase(n.name);
    n._search=(n.name+' '+n.name.replace(/-/g,' ')+' '+(n.mech||'')).toLowerCase();
    S.byId[n.id]=n;
  }
  var doorsRaw=d.doors||{};
  var ids=Object.keys(doorsRaw);
  for(i=0;i<ids.length;i++){
    var did=ids[i], dr=doorsRaw[did];
    var g={ id:did, name:dr.name, gloss:dr.gloss||'', members:[],
            _title:titleCase(dr.name),
            _search:(dr.name+' '+dr.name.replace(/-/g,' ')+' '+(dr.gloss||'')).toLowerCase() };
    S.genusById[did]=g;
    S.genera.push(g);
  }
  for(i=0;i<S.nodes.length;i++){
    n=S.nodes[i];
    if(n.door==null){ S.singletons.push(n); continue; }
    var dkey=String(n.door);
    if(S.genusById[dkey]) S.genusById[dkey].members.push(n);
    else S.singletons.push(n);
  }
  S.genera.sort(function(a,b){ return a.name<b.name?-1:a.name>b.name?1:0; });
  S.genera.forEach(function(g){ g.members.sort(byName); });
  S.singletons.sort(byName);

  var edges=d.edges||[];
  for(i=0;i<edges.length;i++){
    e=edges[i];
    if(!S.byId[e.s]||!S.byId[e.t]) continue;
    if(e.k==='see_also'){ addEdge(S.seeAlso,e.s,e.t,e.n); addEdge(S.seeAlso,e.t,e.s,e.n); }
    else if(e.k==='contrasts_with'){ addEdge(S.contrasts,e.s,e.t,e.n); addEdge(S.contrasts,e.t,e.s,e.n); }
  }
  Object.keys(S.seeAlso).forEach(function(k){ S.seeAlso[k].sort(byOtherName); });
  Object.keys(S.contrasts).forEach(function(k){ S.contrasts[k].sort(byOtherName); });

  /* sequence layers: next = {src:[[dst,n,p]...]}, cooc = {a:[[b,nScripts,lift]...]} */
  S.next=d.next||{}; S.cooc=d.cooc||{};
  Object.keys(S.next).forEach(function(src){
    S.next[src].forEach(function(t){
      (S.prev[t[0]]||(S.prev[t[0]]=[])).push([+src,t[1],t[2]]);
    });
  });
  Object.keys(S.prev).forEach(function(k){ S.prev[k].sort(function(a,b){ return b[1]-a[1]; }); });
  S.annScripts=(d.meta&&d.meta.annotated_scripts)||0;

  S.ready=true;
  document.getElementById('subline').innerHTML=
    '<b>'+S.nodes.length+'</b> techniques · <b>'+S.genera.length+'</b> genera · <b>'+(d.edges||[]).length+'</b> adjudicated relations';
  document.title='Operator Formulary';
}
function byName(a,b){ return a.name<b.name?-1:a.name>b.name?1:0; }
function byOtherName(a,b){ var x=S.byId[a.o].name,y=S.byId[b.o].name; return x<y?-1:x>y?1:0; }
function addEdge(map,from,to,note){
  var arr=map[from]||(map[from]=[]);
  for(var i=0;i<arr.length;i++) if(arr[i].o===to) return;
  arr.push({o:to,n:note||''});
}

/* ============ router ============ */
function route(){
  if(!S.ready) return;
  var h=location.hash.replace(/^#\/?/,'');
  var parts=h.split('/');
  var view=document.getElementById('view');
  memberFilter='';
  graphTeardown();
  document.getElementById('graphLink').classList.toggle('on',parts[0]==='graph');
  if((parts[0]==='genus'||parts[0]==='door')&&S.genusById[parts[1]]) renderGenus(view,S.genusById[parts[1]]);
  else if(parts[0]==='singletons')                 renderSingletons(view);
  else if(parts[0]==='entry'&&S.byId[+parts[1]])   renderEntry(view,S.byId[+parts[1]]);
  else if(parts[0]==='graph')                      renderGraph(view,parts[1]||'relations',parts[2]?+parts[2]:null);
  else                                             renderLanding(view);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ============ landing ============ */
function renderLanding(view){
  view.innerHTML=
    '<div class="searchwrap">'+
      '<input id="q" type="search" autocomplete="off" spellcheck="false" '+
        'placeholder="Search '+S.genera.length+' genera and '+S.nodes.length+' techniques…" '+
        'value="'+esc(searchQuery)+'" aria-label="Search genera and techniques">'+
      '<p class="hint"><kbd>/</kbd> search &nbsp; <kbd>Esc</kbd> up a level &nbsp; <kbd>←→↑↓</kbd> move between rows</p>'+
    '</div>'+
    '<div id="results"></div>';
  var q=document.getElementById('q');
  q.addEventListener('input',function(){ searchQuery=q.value; renderResults(); });
  renderResults();
}

function renderResults(){
  var box=document.getElementById('results');
  if(!box) return;
  var q=searchQuery.trim().toLowerCase();
  var html='';
  if(!q){
    html+='<div class="secthead"><h2>Genera</h2><span class="n">'+S.genera.length+' groups of related techniques · '+S.singletons.length+' standalone</span></div>';
    html+='<div class="gxgrid">';
    for(var i=0;i<S.genera.length;i++) html+=genusRow(S.genera[i]);
    html+='<a class="gx knav" href="#/singletons" title="Techniques that do not share a genus with any other entry">'+
      '<span class="name">Standalone techniques</span><span class="cnt">'+S.singletons.length+'</span></a>';
    html+='</div>';
  }else{
    var gs=S.genera.filter(function(g){ return g._search.indexOf(q)>=0; });
    var hits=S.nodes.filter(function(n){ return n._search.indexOf(q)>=0; });
    html+='<div class="secthead"><h2>Genera</h2><span class="n">'+gs.length+' match</span></div>';
    if(gs.length){
      html+='<div class="gxgrid">';
      for(var j=0;j<gs.length;j++) html+=genusRow(gs[j]);
      html+='</div>';
    }else html+='<div class="empty">No genera match “'+esc(searchQuery.trim())+'”.</div>';
    var CAP=120, shown=hits.slice(0,CAP);
    html+='<div class="secthead"><h2>Techniques</h2><span class="n">'+hits.length+' match'+
      (hits.length>CAP?' · showing first '+CAP:'')+'</span></div>';
    if(hits.length){
      html+='<div class="rows">';
      for(var k=0;k<shown.length;k++) html+=entryRow(shown[k],true);
      html+='</div>';
    }else html+='<div class="empty">No techniques match “'+esc(searchQuery.trim())+'”.</div>';
  }
  box.innerHTML=html;
}

function crumbs(trail,here){

/* ============ graph view ============ */
/* One shared layout (seeded from the payload's PCA coords, settled by a small force
   simulation), three edge overlays: relations / co-occurrence / sequence. Zoom is
   SEMANTIC: node radii and label sizes are constant in screen pixels — zooming in
   spreads the layout so more labels fit, it never inflates the circles. */
var G=null; // graph runtime, torn down on route change

var MACRO_COLORS_L={ }, MACRO_PALETTE=['#2361ae','#a05a1f','#1e8a68','#7b52d6','#a03a2e','#3f7d8c','#8a6d1e','#5b5f9e'];

function graphTeardown(){
  if(G){ G.dead=true; if(G.raf) cancelAnimationFrame(G.raf); window.removeEventListener('resize',G.onResize); G=null; }
}

function renderGraph(view,mode,focusId){
  if(mode!=='relations'&&mode!=='cooccurrence'&&mode!=='sequence') mode='relations';
  view.innerHTML=
    '<div class="gtools" role="tablist" aria-label="Graph mode">'+
      gmodeBtn('relations','Relations',mode)+
      gmodeBtn('cooccurrence','Co-occurrence',mode)+
      gmodeBtn('sequence','Sequence',mode)+
      '<input id="gsearch" type="search" placeholder="Find technique…" autocomplete="off" spellcheck="false" aria-label="Find technique in graph">'+
      '<span class="ghint">scroll to zoom · drag to pan · click a node for detail</span>'+
    '</div>'+
    '<div class="gwrap"><canvas id="gcanvas"></canvas><div id="gpanel" class="gpanel" hidden></div></div>'+
    '<div class="glegend" id="glegend"></div>';

  document.querySelectorAll('.gmode').forEach(function(b){
    b.addEventListener('click',function(){
      location.hash='#/graph/'+b.getAttribute('data-m')+(G&&G.sel?'/'+G.sel:'');
    });
  });

  var canvas=document.getElementById('gcanvas');
  G={ mode:mode, sel:null, hover:null, dead:false,
      k:1, tx:0, ty:0, nodes:S.nodes, canvas:canvas, ctx:canvas.getContext('2d'),
      needsDraw:true, simTicks:0 };

  graphLayoutInit();
  graphEdgesFor(mode);
  graphColors();
  graphLegend();
  graphBindings(canvas);

  G.onResize=function(){ graphFit(); G.needsDraw=true; };
  window.addEventListener('resize',G.onResize);
  graphFit();
  if(focusId&&S.byId[focusId]) graphSelect(focusId,true);
  graphLoop();

  var gs=document.getElementById('gsearch');
  gs.addEventListener('input',function(){ G.query=gs.value.trim().toLowerCase(); G.needsDraw=true; });
  gs.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&G.query){
      var hit=S.nodes.find(function(n){ return n._search.indexOf(G.query)>=0; });
      if(hit){ graphSelect(hit.id,true); }
    }
  });
}
function gmodeBtn(m,label,cur){
  return '<button class="gmode'+(m===cur?' on':'')+'" role="tab" aria-selected="'+(m===cur)+'" data-m="'+m+'">'+label+'</button>';
}

/* --- layout: precomputed at publish time (nodes carry x/y), cached per load --- */
var LAYOUT=null;
function graphLayoutInit(){
  if(LAYOUT){ G.pos=LAYOUT; return; }
  var pos={}, i, n;
  for(i=0;i<S.nodes.length;i++){
    n=S.nodes[i];
    if(typeof n.x==='number'&&typeof n.y==='number'){ pos[n.id]={x:n.x, y:n.y}; }
    else{
      var a=(i/S.nodes.length)*Math.PI*2;
      pos[n.id]={x:Math.cos(a)*540, y:Math.sin(a)*540};
    }
  }
  G.pos=LAYOUT=pos;
}

function pushPair(arr,seen,a,b,w){
  var k=a<b?a+'_'+b:b+'_'+a;
  if(seen[k]) return; seen[k]=1;
  arr.push([a,b,w]);
}

/* --- per-mode edge lists for DRAWING --- */
function graphEdgesFor(mode){
  var edges=[], seen={};
  if(mode==='relations'){
    S.nodes.forEach(function(n){
      (S.seeAlso[n.id]||[]).forEach(function(s){ pushPair(edges,seen,n.id,s.o,1); });
      (S.contrasts[n.id]||[]).forEach(function(s){
        var k=n.id<s.o?n.id+'_'+s.o:s.o+'_'+n.id;
        if(!seen[k]){ seen[k]=1; edges.push([n.id,s.o,1,'c']); }
      });
    });
  }else if(mode==='cooccurrence'){
    Object.keys(S.cooc).forEach(function(a){
      S.cooc[a].forEach(function(t){ if(t[1]>=3) pushPair(edges,seen,+a,t[0],Math.min(1,t[1]/20)); });
    });
  }else{ // sequence: DIRECTED [src,dst,weight]
    Object.keys(S.next).forEach(function(a){
      S.next[a].forEach(function(t){ if(t[1]>=2) edges.push([+a,t[0],Math.min(1,t[2]*3),'d']); });
    });
  }
  G.edges=edges;
}

/* --- colors & legend --- */
function graphColors(){
  var macros=[], seen={};
  S.nodes.forEach(function(n){ var m=n.macroclass||'other'; if(!seen[m]){ seen[m]=1; macros.push(m); } });
  macros.sort();
  G.macroColor={};
  macros.forEach(function(m,i){ G.macroColor[m]=MACRO_PALETTE[i%MACRO_PALETTE.length]; });
  G.macros=macros;
}
function graphLegend(){
  var el=document.getElementById('glegend');
  if(!el) return;
  var html='';
  G.macros.forEach(function(m){
    html+='<span><span class="sw" style="background:'+G.macroColor[m]+'"></span>'+esc(m)+'</span>';
  });
  if(G.mode==='sequence') html+='<span style="margin-left:auto">edges point from a technique to what follows it (≥2 observations)</span>';
  if(G.mode==='cooccurrence') html+='<span style="margin-left:auto">edge weight = scripts where both techniques appear (≥3)</span>';
  el.innerHTML=html;
}

/* --- viewport --- */
function graphFit(){
  var c=G.canvas, dpr=window.devicePixelRatio||1;
  var r=c.getBoundingClientRect();
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  G.dpr=dpr; G.w=r.width; G.h=r.height;
  if(!G.fitted){
    var xs=[],ys=[];
    S.nodes.forEach(function(n){ var p=G.pos[n.id]; xs.push(p.x); ys.push(p.y); });
    var minx=Math.min.apply(null,xs), maxx=Math.max.apply(null,xs);
    var miny=Math.min.apply(null,ys), maxy=Math.max.apply(null,ys);
    var kx=G.w/((maxx-minx)||1), ky=G.h/((maxy-miny)||1);
    G.k=Math.min(kx,ky)*0.86;
    G.fitK=G.k;
    G.tx=G.w/2-(minx+maxx)/2*G.k;
    G.ty=G.h/2-(miny+maxy)/2*G.k;
    G.fitted=true;
  }
}
function toScreen(p){ return [p.x*G.k+G.tx, p.y*G.k+G.ty]; }
function toWorld(sx,sy){ return [(sx-G.tx)/G.k,(sy-G.ty)/G.k]; }

/* --- interactions --- */
function graphBindings(canvas){
  var dragging=false, moved=false, lx=0, ly=0;
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    G.userMoved=true;
    var rect=canvas.getBoundingClientRect();
    var mx=e.clientX-rect.left, my=e.clientY-rect.top;
    var k2=G.k*Math.exp(-e.deltaY*0.0016);
    k2=Math.max(0.12,Math.min(16,k2));
    G.tx=mx-(mx-G.tx)*(k2/G.k);
    G.ty=my-(my-G.ty)*(k2/G.k);
    G.k=k2; G.needsDraw=true;
  },{passive:false});
  canvas.addEventListener('pointerdown',function(e){
    dragging=true; moved=false; lx=e.clientX; ly=e.clientY;
    canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove',function(e){
    var rect=canvas.getBoundingClientRect();
    if(dragging){
      var dx=e.clientX-lx, dy=e.clientY-ly;
      if(Math.abs(dx)+Math.abs(dy)>3){ moved=true; G.userMoved=true; }
      G.tx+=dx; G.ty+=dy; lx=e.clientX; ly=e.clientY; G.needsDraw=true;
    }else{
      var hit=graphHit(e.clientX-rect.left,e.clientY-rect.top);
      if(hit!==G.hover){ G.hover=hit; G.needsDraw=true; canvas.style.cursor=hit?'pointer':'grab'; }
    }
  });
  canvas.addEventListener('pointerup',function(e){
    dragging=false; canvas.classList.remove('dragging');
    if(!moved){
      var rect=canvas.getBoundingClientRect();
      var hit=graphHit(e.clientX-rect.left,e.clientY-rect.top);
      if(hit) graphSelect(hit,false);
      else{ G.sel=null; document.getElementById('gpanel').hidden=true; G.needsDraw=true; }
    }
  });
  canvas.addEventListener('dblclick',function(e){
    var rect=canvas.getBoundingClientRect();
    var hit=graphHit(e.clientX-rect.left,e.clientY-rect.top);
    if(hit) graphSelect(hit,true);
  });
}
function graphHit(sx,sy){
  var best=null, bestD=110; // 10.5px radius
  for(var i=0;i<S.nodes.length;i++){
    var p=toScreen(G.pos[S.nodes[i].id]);
    var dx=p[0]-sx, dy=p[1]-sy, d=dx*dx+dy*dy;
    if(d<bestD){ bestD=d; best=S.nodes[i].id; }
  }
  return best;
}
function graphSelect(id,center){
  G.sel=id; G.needsDraw=true;
  if(center){
    var p=G.pos[id];
    var k=Math.max(G.k,(G.fitK||1)*3.2);
    G.userMoved=true;
    G.k=k; G.tx=G.w/2-p.x*k; G.ty=G.h/2-p.y*k;
  }
  graphPanel(id);
}

/* --- side panel --- */
function graphPanel(id){
  var n=S.byId[id], el=document.getElementById('gpanel');
  if(!n||!el) return;
  var g=(n.door!=null)?S.genusById[String(n.door)]:null;
  var html='<h3>'+esc(n._title)+'</h3>'+
    '<p class="gdoor">'+(g?esc(g._title):'standalone')+
    (typeof n.reach==='number'&&n.reach>0?' · '+n.reach+' source scripts':'')+'</p>'+
    '<p class="gmech">'+esc(n.mech||'')+'</p>';
  function rows(title,list,fmt){
    if(!list||!list.length) return '';
    var h='<p class="lab">'+title+'</p>';
    list.slice(0,8).forEach(function(t){
      var o=S.byId[t[0]];
      if(!o) return;
      h+='<div class="grow2'+(t[1]<2?' mut':'')+'" data-go="'+o.id+'">'+
        '<span class="gname">'+esc(o._title)+'</span><span class="gstat">'+fmt(t)+'</span></div>';
    });
    return h;
  }
  if(G.mode==='sequence'){
    html+=rows('Often follows this',S.next[id]||[],function(t){ return (t[2]*100).toFixed(0)+'% · '+t[1]+'×'; });
    html+=rows('Often precedes this',S.prev[id]||[],function(t){ return t[1]+'×'; });
  }else if(G.mode==='cooccurrence'){
    html+=rows('Co-occurs with',S.cooc[id]||[],function(t){ return t[1]+' scripts'; });
  }else{
    var rel=(S.seeAlso[id]||[]).map(function(s){ return [s.o,9]; });
    html+=rows('Related',rel,function(){ return ''; });
    var con=(S.contrasts[id]||[]).map(function(s){ return [s.o,9]; });
    html+=rows('Distinguish from',con,function(){ return ''; });
  }
  html+='<a class="gopen" href="#/entry/'+n.id+'">Open entry</a>';
  el.innerHTML=html; el.hidden=false;
  el.querySelectorAll('.grow2').forEach(function(r){
    r.addEventListener('click',function(){ graphSelect(+r.getAttribute('data-go'),true); });
  });
}

/* --- draw loop --- */
function graphLoop(){
  if(!G||G.dead) return;
  if(G.needsDraw){ graphDraw(); G.needsDraw=false; }
  G.raf=requestAnimationFrame(graphLoop);
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function graphDraw(){
  var ctx=G.ctx, dpr=G.dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,G.w,G.h);
  var ink3=cssVar('--ink-3'), ink1=cssVar('--ink-1'), line=cssVar('--line-2'), accent=cssVar('--accent');
  var selSet=null;
  if(G.sel!=null){
    selSet={}; selSet[G.sel]=1;
    G.edges.forEach(function(e){ if(e[0]===G.sel) selSet[e[1]]=1; if(e[1]===G.sel) selSet[e[0]]=1; });
  }

  // edges — 1px screen-space, alpha by weight; dimmed when a selection exists
  ctx.lineWidth=1;
  for(var i=0;i<G.edges.length;i++){
    var e=G.edges[i];
    var a=G.pos[e[0]], b=G.pos[e[1]];
    if(!a||!b) continue;
    var pa=toScreen(a), pb=toScreen(b);
    if((pa[0]<0&&pb[0]<0)||(pa[0]>G.w&&pb[0]>G.w)||(pa[1]<0&&pb[1]<0)||(pa[1]>G.h&&pb[1]>G.h)) continue;
    var onSel=selSet&&(e[0]===G.sel||e[1]===G.sel);
    var alpha=selSet? (onSel?0.85:0.05) : 0.13+0.35*(e[2]||0.5);
    ctx.strokeStyle=(e[3]==='c')? cssVar('--high') : (onSel?accent:ink3);
    ctx.globalAlpha=alpha;
    ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]); ctx.stroke();
    if(e[3]==='d'&&(!selSet||onSel)){ // arrowhead, constant screen size
      var dx=pb[0]-pa[0], dy=pb[1]-pa[1], L=Math.sqrt(dx*dx+dy*dy)||1;
      var ux=dx/L, uy=dy/L, hx=pb[0]-ux*7, hy=pb[1]-uy*7;
      ctx.beginPath();
      ctx.moveTo(pb[0]-ux*4,pb[1]-uy*4);
      ctx.lineTo(hx-uy*3.2,hy+ux*3.2);
      ctx.lineTo(hx+uy*3.2,hy-ux*3.2);
      ctx.closePath();
      ctx.fillStyle=onSel?accent:ink3;
      ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  // nodes — CONSTANT screen radius regardless of zoom
  var R=4.2, q=G.query;
  var labelZoom=G.k>=(G.fitK||1)*2.2;
  for(var j=0;j<S.nodes.length;j++){
    var n=S.nodes[j], p=toScreen(G.pos[n.id]);
    if(p[0]<-12||p[0]>G.w+12||p[1]<-12||p[1]>G.h+12) continue;
    var col=G.macroColor[n.macroclass||'other']||ink3;
    var dim=(selSet&&!selSet[n.id])||(q&&n._search.indexOf(q)<0);
    ctx.globalAlpha=dim?0.16:0.92;
    ctx.beginPath();
    ctx.arc(p[0],p[1],(n.id===G.sel||n.id===G.hover)?R+1.8:R,0,Math.PI*2);
    ctx.fillStyle=col;
    ctx.fill();
    if(n.id===G.sel){
      ctx.globalAlpha=1; ctx.lineWidth=1.6; ctx.strokeStyle=ink1;
      ctx.beginPath(); ctx.arc(p[0],p[1],R+3.4,0,Math.PI*2); ctx.stroke(); ctx.lineWidth=1;
    }
  }
  // labels — constant screen size, appear with zoom / selection / hover / search
  ctx.globalAlpha=1;
  ctx.font='11px ui-sans-serif,system-ui,sans-serif';
  ctx.textBaseline='middle';
  for(var m=0;m<S.nodes.length;m++){
    var nn=S.nodes[m], pp=toScreen(G.pos[nn.id]);
    if(pp[0]<-160||pp[0]>G.w+40||pp[1]<0||pp[1]>G.h) continue;
    var show=false;
    if(nn.id===G.sel||nn.id===G.hover) show=true;
    else if(selSet&&selSet[nn.id]) show=true;
    else if(q&&nn._search.indexOf(q)>=0&&G.k>=0.9) show=true;
    else if(labelZoom&&(!selSet)&&(!q)) show=true;
    if(!show) continue;
    var txt=nn._title;
    ctx.fillStyle=cssVar('--surface-1');
    var w=ctx.measureText(txt).width;
    ctx.globalAlpha=0.82;
    ctx.fillRect(pp[0]+7,pp[1]-8,w+8,16);
    ctx.globalAlpha=1;
    ctx.fillStyle=(nn.id===G.sel)?accent:ink1;
    ctx.fillText(txt,pp[0]+11,pp[1]);
  }
}

/* ============ keyboard ============ */
document.addEventListener('keydown',function(e){
  if(!S.ready) return;
  var tgt=e.target, inInput=tgt&&(tgt.tagName==='INPUT'||tgt.tagName==='TEXTAREA');

  if(e.key==='/'&&!inInput){
    e.preventDefault();
    var q=document.getElementById('q')||document.getElementById('gsearch');
    if(q){ q.focus(); q.select(); }
    else{
      location.hash='#/';
      setTimeout(function(){ var qq=document.getElementById('q'); if(qq){ qq.focus(); qq.select(); } },0);
    }
    return;
  }

  if(e.key==='Escape'){
    if(inInput){
      if(tgt.value){
        tgt.value='';
        if(tgt.id==='q'){ searchQuery=''; renderResults(); }
        if(tgt.id==='memberFilter'){ memberFilter=''; paintSingletons(); }
        if(tgt.id==='gsearch'&&G){ G.query=''; G.needsDraw=true; }
      }else tgt.blur();
      return;
    }
    var h=location.hash.replace(/^#\/?/,''), parts=h.split('/');
    if(parts[0]==='entry'){
      var node=S.byId[+parts[1]];
      if(node&&node.door!=null&&S.genusById[String(node.door)]) location.hash='#/genus/'+node.door;
      else location.hash='#/singletons';
    }
    else if(parts[0]==='graph'&&G&&G.sel!=null){ G.sel=null; document.getElementById('gpanel').hidden=true; G.needsDraw=true; }
    else if(parts[0]!=='') location.hash='#/';
    return;
  }

  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){
    if(inInput) return;
    var items=Array.prototype.slice.call(document.querySelectorAll('.knav'));
    if(!items.length) return;
    var cur=items.indexOf(document.activeElement);
    if(cur<0){ items[0].focus(); e.preventDefault(); return; }
    var next=-1;
    if(e.key==='ArrowLeft')  next=cur-1;
    if(e.key==='ArrowRight') next=cur+1;
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      next=nearestVertical(items,cur,e.key==='ArrowDown'?1:-1);
    }
    if(next>=0&&next<items.length){
      items[next].focus();
      items[next].scrollIntoView({block:'nearest'});
      e.preventDefault();
    }
  }
});

function nearestVertical(items,cur,dir){
  var me=items[cur].getBoundingClientRect();
  var myTop=me.top+window.scrollY, myX=me.left+me.width/2;
  var best=-1,bestDy=Infinity,bestDx=Infinity;
  for(var i=0;i<items.length;i++){
    if(i===cur) continue;
    var r=items[i].getBoundingClientRect();
    var top=r.top+window.scrollY;
    var dy=(top-myTop)*dir;
    if(dy<=2) continue;
    var dx=Math.abs(r.left+r.width/2-myX);
    if(dy<bestDy-2||(Math.abs(dy-bestDy)<=2&&dx<bestDx)){ best=i; bestDy=dy; bestDx=dx; }
  }
  return best;
}

loadData();
</script>
